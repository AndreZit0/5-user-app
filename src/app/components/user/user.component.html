<h3>{{ title }}</h3>

    <button class="btn btn-primary my-4 "
    [routerLink]="['/users/create']">Crear Usuario</button>

@if (users.length == 0) {
        <div class="alert alert-warning">No hay Registros en el Sistema</div>
        } @else{
        <table class="table table-hover table-striped">
          <thead>
            <tr>
              <!-- <th>id</th> -->
              <th>name</th>
              <th>lastname</th>
              <th>email</th>
              <th>username</th>
              <th>Remove</th>
              <th>update</th>
            </tr>
          </thead>
          <tbody>
            @for (user of users; track $index) {
            <tr>
              <!-- <td>{{user.id}}</td> -->
              <td>{{user.name}}</td>
              <td>{{user.lastname}}</td>
              <td>{{user.email}}</td>
              <td>{{user.username}}</td>
              <td>
                <button class="btn btn-danger btn-danger" 
                (click)="onRemoveUser(user.id)">
                  
                  remove
                </button>
              </td>
              <td>
                <button class="btn btn-success" 
                (click)="onSlectedUser(user)">
                  
                  update
                </button>
              </td>
            </tr>
            }
          </tbody>
        </table>
        }
